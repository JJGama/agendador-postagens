<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendador de Postagens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="datetime-local"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="datetime-local"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .post-item {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            transition: all 0.3s ease;
        }

        .post-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .post-number {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #667eea;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #e84118;
            transform: translateY(-2px);
        }

        .add-post-btn {
            background: #48dbfb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            width: 100%;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .add-post-btn:hover {
            background: #0abde3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 219, 251, 0.3);
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .posts-container {
            margin-bottom: 20px;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 90%;
            max-height: 80%;
            overflow: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4757;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
        }

        .modal-close:hover {
            background: #e84118;
        }

        .json-display {
            background: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            overflow: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .copy-btn {
            background: #48dbfb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 600;
        }

        .copy-btn:hover {
            background: #0abde3;
        }

        .response-header {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .response-header.success {
            color: #155724;
        }

        .response-header.error {
            color: #721c24;
        }

        .status-code {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: bold;
            margin-left: 10px;
            font-size: 0.9em;
        }

        .status-code.success {
            background: #d4edda;
            color: #155724;
        }

        .status-code.error {
            background: #f8d7da;
            color: #721c24;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px 15px;
            border: 2px dashed #e0e0e0;
            border-radius: 10px;
            background: #fafafa;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            color: #666;
        }

        .file-input-label:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .file-name {
            margin-top: 8px;
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Agendador de Postagens</h1>
        <p class="subtitle">Configure suas postagens e envie para o webhook</p>

        <div class="form-group">
            <label for="webhookUrl">🔗 URL do Webhook</label>
            <input type="text" id="webhookUrl" placeholder="https://seu-webhook.com/endpoint" required>
        </div>

        <div class="posts-container" id="postsContainer">
            <!-- Posts serão adicionados aqui dinamicamente -->
        </div>

        <button class="add-post-btn" onclick="addPost()">➕ Adicionar Postagem</button>

        <button class="submit-btn" onclick="submitPosts()">🚀 Enviar para Webhook</button>

        <div class="status-message" id="statusMessage"></div>

        <!-- Modal para mostrar dados JSON -->
        <div class="modal" id="dataModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">×</button>
                <div id="modalHeader"></div>
                <div class="json-display" id="jsonDisplay"></div>
                <button class="copy-btn" onclick="copyJSON()">📋 Copiar Resposta</button>
            </div>
        </div>
    </div>

    <script>
        let postCount = 0;
        let posts = [];

        function addPost() {
            postCount++;
            const postId = `post-${postCount}`;
            
            const postHtml = `
                <div class="post-item" id="${postId}">
                    <div class="post-number">${postCount}</div>
                    <div class="form-group">
                        <label>📝 Mensagem</label>
                        <textarea class="post-message" placeholder="Digite a mensagem da postagem..." rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>🖼️ Imagem/Vídeo (opcional)</label>
                        <div class="file-input-wrapper">
                            <input type="file" class="post-media" accept="image/*,video/*" onchange="handleFileSelect(this)">
                            <label class="file-input-label" onclick="this.previousElementSibling.click()">
                                Clique para selecionar arquivo
                            </label>
                            <div class="file-name"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>🕐 Data e Hora</label>
                        <input type="datetime-local" class="post-datetime" required>
                    </div>
                    <button class="remove-btn" onclick="removePost('${postId}')">🗑️ Remover</button>
                </div>
            `;
            
            document.getElementById('postsContainer').insertAdjacentHTML('beforeend', postHtml);
        }

        function handleFileSelect(input) {
            const fileName = input.files[0]?.name || '';
            const fileNameDisplay = input.parentElement.querySelector('.file-name');
            if (fileName) {
                fileNameDisplay.textContent = `📎 ${fileName}`;
            } else {
                fileNameDisplay.textContent = '';
            }
        }

        function removePost(postId) {
            const post = document.getElementById(postId);
            if (post) {
                post.remove();
            }
        }

        async function submitPosts() {
            const webhookUrl = document.getElementById('webhookUrl').value.trim();
            const statusMessage = document.getElementById('statusMessage');
            
            if (!webhookUrl) {
                showStatus('Por favor, insira a URL do webhook', 'error');
                return;
            }

            const postItems = document.querySelectorAll('.post-item');
            
            if (postItems.length === 0) {
                showStatus('Adicione pelo menos uma postagem', 'error');
                return;
            }

            const postsData = [];

            for (let item of postItems) {
                const message = item.querySelector('.post-message').value.trim();
                const datetime = item.querySelector('.post-datetime').value;
                const mediaInput = item.querySelector('.post-media');
                
                if (!message || !datetime) {
                    showStatus('Preencha todos os campos obrigatórios', 'error');
                    return;
                }

                const postData = {
                    message: message,
                    scheduled_time: datetime,
                    media: null
                };

                if (mediaInput.files[0]) {
                    const file = mediaInput.files[0];
                    const base64 = await fileToBase64(file);
                    
                    // Remove o prefixo data:image/...;base64, se necessário
                    const base64Clean = base64.includes(',') ? base64.split(',')[1] : base64;
                    
                    postData.media = {
                        filename: file.name,
                        type: file.type,
                        size: file.size,
                        data: base64Clean,  // Apenas o base64 puro
                        data_url: base64     // URL completa para preview
                    };
                }

                postsData.push(postData);
            }

            const payload = {
                webhook_url: webhookUrl,
                posts: postsData,
                timestamp: new Date().toISOString()
            };

            try {
                // Tenta enviar para o webhook real
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                console.log('📤 Dados enviados para o webhook:');
                console.log(JSON.stringify(payload, null, 2));
                
                // Tenta ler a resposta do servidor
                let serverResponse;
                try {
                    serverResponse = await response.json();
                } catch (e) {
                    serverResponse = await response.text();
                }

                console.log('📥 Resposta do servidor:');
                console.log(serverResponse);
                
                if (response.ok) {
                    showStatus(`✅ ${postsData.length} postagem(ns) enviada(s) com sucesso!`, 'success');
                    showResponseModal(serverResponse, true, response.status);
                } else {
                    showStatus(`⚠️ Servidor respondeu com erro (${response.status})`, 'error');
                    showResponseModal(serverResponse, false, response.status);
                }
                
            } catch (error) {
                console.log('❌ Erro ao enviar:');
                console.log(error);
                
                showStatus('❌ Erro de conexão: ' + error.message, 'error');
                
                // Mostra modal com o erro e os dados que seriam enviados
                showResponseModal({
                    error: error.message,
                    dados_enviados: payload
                }, false, 0);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function showStatus(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.className = `status-message status-${type}`;
            statusMessage.style.display = 'block';
            
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }

        function showDataModal(payload) {
            const modal = document.getElementById('dataModal');
            const jsonDisplay = document.getElementById('jsonDisplay');
            const modalHeader = document.getElementById('modalHeader');
            
            modalHeader.innerHTML = `
                <h2>📦 Dados Enviados</h2>
                <p style="margin: 15px 0; color: #666;">Dados que foram enviados para o webhook:</p>
            `;
            
            jsonDisplay.textContent = JSON.stringify(payload, null, 2);
            modal.style.display = 'flex';
        }

        function showResponseModal(response, isSuccess, statusCode) {
            const modal = document.getElementById('dataModal');
            const jsonDisplay = document.getElementById('jsonDisplay');
            const modalHeader = document.getElementById('modalHeader');
            
            const statusClass = isSuccess ? 'success' : 'error';
            const icon = isSuccess ? '✅' : '❌';
            const title = isSuccess ? 'Sucesso!' : 'Erro na Resposta';
            
            modalHeader.innerHTML = `
                <div class="response-header ${statusClass}">
                    <h2>${icon} ${title}</h2>
                    ${statusCode > 0 ? `<span class="status-code ${statusClass}">Status: ${statusCode}</span>` : ''}
                </div>
                <p style="margin: 15px 0; color: #666;">Resposta do servidor:</p>
            `;
            
            if (typeof response === 'object') {
                jsonDisplay.textContent = JSON.stringify(response, null, 2);
            } else {
                jsonDisplay.textContent = response;
            }
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('dataModal');
            modal.style.display = 'none';
            
            // Limpa os campos após fechar o modal
            setTimeout(() => {
                document.getElementById('postsContainer').innerHTML = '';
                document.getElementById('webhookUrl').value = '';
                postCount = 0;
                addPost();
            }, 300);
        }

        function copyJSON() {
            const jsonDisplay = document.getElementById('jsonDisplay');
            const textArea = document.createElement('textarea');
            textArea.value = jsonDisplay.textContent;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            alert('✅ JSON copiado para a área de transferência!');
        }

        // Adicionar primeira postagem automaticamente
        addPost();
    </script>
</body>
</html>
